name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The core must work with no provider library installed. That is the property
  # worth protecting: if a test ever needs a key or a vendor package, the gate
  # has stopped being auditable for free.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install without providers
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Runs unit, integration and contract suites. The contract suite is what
      # enforces Constitution Principle IV: ensemble and ledger must import
      # nothing from any agent package. That is a checkable property, so it gets
      # checked here rather than trusted to review.
      - name: Test
        run: pytest -v

      - name: Confirm the core imports with no provider library
        run: python -c "import ensemble, ledger; print('core imports clean')"

  # The adapter tests skip themselves without litellm, so without this job they
  # would never run anywhere. Still no API key: every test here is offline.
  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with providers
        run: pip install -e ".[dev,providers]"

      - name: Test
        run: pytest -v

      - name: Confirm no adapter test was silently skipped
        run: pytest tests/unit/test_providers.py -v --no-header -rs | grep -qv SKIPPED

  # The artifacts, run as a pipeline would run them. Until this existed,
  # plan_cost was a CI gate that had never once run in CI, and the only
  # evidence it gated anything was that its tests said so.
  #
  # Every step asserts an exit code from the contract in ci/__init__.py:
  # 0 ran and nothing to stop for, 1 ran and the answer is stop, 2 could not
  # judge. No credential is needed for any of it.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install without providers
        run: pip install -e ".[dev]"

      # A gate that blocks. Eight nodes with no autoscaling block, in staging.
      - name: plan_cost blocks a costly staging change
        run: >
          tools/expect-exit.sh 1
          python -m plan_cost --plan plan_cost/fixtures/estate/plan.json --env staging

      # The same plan in production reports instead, because a cost tool must
      # not stand in front of an urgent production change.
      - name: plan_cost reports the same change in production
        run: >
          tools/expect-exit.sh 0
          python -m plan_cost --plan plan_cost/fixtures/estate/plan.json --env production

      # Could not judge. This is the code that must never be mistaken for clean.
      - name: plan_cost refuses a plan with no environment
        run: >
          tools/expect-exit.sh 2
          python -m plan_cost
          --plan plan_cost/fixtures/demo/incident-io-schedule-no-environment.json
          --prices plan_cost/fixtures/demo/prices.demo.toml

      - name: plan_cost refuses a plan format it has not been checked against
        run: >
          tools/expect-exit.sh 2
          python -m plan_cost
          --plan plan_cost/fixtures/demo/unchecked-format-version.json
          --prices plan_cost/fixtures/demo/prices.demo.toml

      # Five of the eight fixtures carry a structural defect.
      - name: rca_agent blocks a corpus with structural defects
        run: >
          tools/expect-exit.sh 1
          python -m rca_agent --corpus rca_agent/fixtures/corpus
          --as-of 2026-09-01 --fail-on-defects

      # The same corpus without the flag reports and passes. Gating is opt-in.
      - name: rca_agent reports without the gate flag
        run: >
          tools/expect-exit.sh 0
          python -m rca_agent --corpus rca_agent/fixtures/corpus --as-of 2026-09-01

      # A reporter, not a gate. It never returns 1, and forcing it to would be
      # dressing up an analysis as a build-breaking condition.
      - name: cost_agent reports and does not gate
        run: >
          tools/expect-exit.sh 0
          python -m cost_agent
          --costs cost_agent/fixtures/estate_a/costs.csv
          --inventory cost_agent/fixtures/estate_a/inventory.json
          --as-of 2026-09-01

      - name: cost_agent refuses input it cannot read
        run: >
          tools/expect-exit.sh 2
          python -m cost_agent
          --costs cost_agent/fixtures/estate_a/costs.csv
          --inventory does-not-exist.json
          --as-of 2026-09-01
