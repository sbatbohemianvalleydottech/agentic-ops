name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The core must work with no provider library installed. That is the property
  # worth protecting: if a test ever needs a key or a vendor package, the gate
  # has stopped being auditable for free.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install without providers
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Runs unit, integration and contract suites. The contract suite is what
      # enforces Constitution Principle IV: ensemble and ledger must import
      # nothing from any agent package. That is a checkable property, so it gets
      # checked here rather than trusted to review.
      - name: Test
        run: pytest -v

      - name: Confirm the core imports with no provider library
        run: python -c "import ensemble, ledger; print('core imports clean')"

  # The adapter tests skip themselves without litellm, so without this job they
  # would never run anywhere. Still no API key: every test here is offline.
  providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with providers
        run: pip install -e ".[dev,providers]"

      - name: Test
        run: pytest -v

      - name: Confirm no adapter test was silently skipped
        run: pytest tests/unit/test_providers.py -v --no-header -rs | grep -qv SKIPPED
