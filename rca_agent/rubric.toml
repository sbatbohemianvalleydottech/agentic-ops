# The reviewable rubric.
#
# Drawn from published incident practice rather than invented, so it can be cited
# when challenged. Sources are noted per setting. Change any of it and re-run; no
# code edit required.

# The four moments the operational story lives between. A missing one usually
# means it was never measured.
# Configurable because organisations name these differently, and a rubric that
# insists on someone else's vocabulary gets ignored.
required_moments = ["detection", "escalation", "mitigation", "resolution"]

# PagerDuty, Effective Postmortems: avoid the concept of human error. Mistakes are
# rarely rooted in one person's actions; they result from multiple contributing
# factors such as poor documentation or missing rate limiting.
#
# These are matched against the stated cause and contributing factors ONLY, never
# the narrative. "Sam restarted the service" is good practice. "Sam failed to
# check the config" is the failure. Language is a far better signal than a name.
# Phrases that only blame somebody when a person is the subject of the same
# sentence. "The engineer failed to check the config" is blame. "The job failed
# to start" is ordinary incident English, and a check that fires on it trains
# people to ignore the check, which is the failure this rubric exists to avoid.
# Found by running the tool against published incident reports.
blame_phrases = [
    "failed to",
    "forgot to",
    "should have known",
    "did not follow",
    "was careless",
    "neglected to",
]

# incident.io ships a policy of this shape: critical incidents must export
# follow-ups to an external tracker within a window of closure. Seven days is
# their example. It converts "we agreed to do things" into a checkable claim.
# Blame on their own, with no subject needed: each names a person by
# construction.
blame_phrases_standalone = ["human error", "operator error", "user error"]

# What counts as a person, besides anybody on the incident's own participant
# roster. Add your own titles here rather than editing code.
human_subjects = [
    "engineer", "operator", "on-call", "oncall", "developer", "technician",
    "administrator", "admin", "analyst", "someone", "somebody", "he", "she",
    "they",
]

export_window_days = 7

# The scale judgement dimensions are graded on. Needs at least two grades or
# disagreement is impossible and the gate is meaningless.
grade_scale = ["weak", "adequate", "strong"]

# PagerDuty's template treats contributing factors as plural by design. A single
# root cause with nothing contributing to it is rare enough to be worth a look.
min_contributing_factors = 2

# What a document has to record before --judgement is worth paying for. Any one
# of these present is enough. All of them absent means the document states
# neither why the incident happened nor what anyone will do about it, so the
# three judgement dimensions have nothing to read, and two vendors plus a judge
# will return weak or contested on every one of them.
#
# Found by pointing --judgement at published status page entries: $0.2817 spent
# grading the depth of analysis in documents containing no analysis, which the
# free structural pass had already established. Override per run with
# --judge-anyway, or empty this list to switch the bar off entirely.
judgement_requires_any = ["contributing_factors", "action_items"]
