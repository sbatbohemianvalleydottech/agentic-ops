# The reviewable rubric.
#
# Drawn from published incident practice rather than invented, so it can be cited
# when challenged. Sources are noted per setting. Change any of it and re-run; no
# code edit required.

# The four moments the operational story lives between. A missing one usually
# means it was never measured.
# Configurable because organisations name these differently, and a rubric that
# insists on someone else's vocabulary gets ignored.
required_moments = ["detection", "escalation", "mitigation", "resolution"]

# PagerDuty, Effective Postmortems: avoid the concept of human error. Mistakes are
# rarely rooted in one person's actions; they result from multiple contributing
# factors such as poor documentation or missing rate limiting.
#
# These are matched against the stated cause and contributing factors ONLY, never
# the narrative. "Sam restarted the service" is good practice. "Sam failed to
# check the config" is the failure. Language is a far better signal than a name.
blame_phrases = [
    "human error",
    "operator error",
    "user error",
    "failed to",
    "forgot to",
    "should have known",
    "did not follow",
    "was careless",
    "neglected to",
]

# incident.io ships a policy of this shape: critical incidents must export
# follow-ups to an external tracker within a window of closure. Seven days is
# their example. It converts "we agreed to do things" into a checkable claim.
export_window_days = 7

# The scale judgement dimensions are graded on. Needs at least two grades or
# disagreement is impossible and the gate is meaningless.
grade_scale = ["weak", "adequate", "strong"]

# PagerDuty's template treats contributing factors as plural by design. A single
# root cause with nothing contributing to it is rare enough to be worth a look.
min_contributing_factors = 2
